name: Daily Hive Check-In

on:
  schedule:
    - cron: '0 13 * * *'   # 12:00 UTC = 19:00 WIB
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install web3 eth_utils

      - name: Run check-in
        env:
          PRIVATE_KEYS: ${{ secrets.PRIVATE_KEYS }}
          RPC_URL: ${{ secrets.RPC_URL }}
        run: python main.py
